# Proposes updates of the pinned GitHub Actions and of the Rust crates,
# once a week, for versions out for at least a week (security fixes come
# at once); each update is a pull request that runs the CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
