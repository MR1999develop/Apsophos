name: CI

on:
  push:
  pull_request:

# read-only token: the checks change nothing in the repository
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      # the toolchain is pinned in rust-toolchain.toml
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      # DirectML and TensorRT for RTX are Windows builds here: Linux builds without them
      - run: cargo clippy --workspace --all-targets ${{ runner.os == 'Linux' && '--no-default-features' || '' }} -- -D warnings
      - run: cargo test --workspace ${{ runner.os == 'Linux' && '--no-default-features' || '' }}

  # licences, security advisories and sources of the dependencies (deny.toml)
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
