name: Release

# A tag v<version> (the version in Cargo.toml) builds the Windows package and
# installer and attaches them to a DRAFT release, which is published by hand.
# Run by hand (Actions ▸ Release ▸ Run workflow) it only builds them, as
# artifacts. The package is the DirectML and CPU one: the TensorRT for RTX
# DLLs are an NVIDIA download that the workflow cannot fetch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    # the owner approves every run (environment "release")
    environment: release
    # writing only for the draft release and its provenance attestation
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # whether the repository has a code-signing certificate (secrets
      # SIGN_PFX, the .pfx in base64, and SIGN_PASSWORD)
      CAN_SIGN: ${{ secrets.SIGN_PFX != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME, but Cargo.toml says $v"
          }
          "VERSION=$v" >> $env:GITHUB_ENV
          "NAME=Apsophos-$v-windows-x64-directml" >> $env:GITHUB_ENV

      # the models, from the original KAIR weights: export_onnx_model.py
      # checks their SHA-256 and reads only tensors from the checkpoint
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Models
        shell: pwsh
        run: |
          python -m pip install --quiet numpy
          $weights = Join-Path $env:RUNNER_TEMP 'scunet_color_real_psnr.pth'
          Invoke-WebRequest https://github.com/cszn/KAIR/releases/download/v1.0/scunet_color_real_psnr.pth -OutFile $weights
          foreach ($tile in 448, 960, 1216) {
            python tools/export_onnx_model.py --weights $weights --tile $tile --output models/scunet_color_real_$tile.onnx
            if ($LASTEXITCODE) { throw "export of the $tile px model failed" }
          }
          python tools/make_fp16_model.py models/scunet_color_real_960.onnx models/scunet_color_real_1216.onnx
          if ($LASTEXITCODE) { throw "FP16 conversion failed" }

      # the toolchain is pinned in rust-toolchain.toml
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # cargo-auditable writes the dependency list (names, versions, sources)
      # into the executable, so `cargo audit bin apsophos.exe` can check a
      # released program against the advisories without the repository.
      # Pinned version, built from its own lock file.
      - name: cargo-auditable
        run: cargo install --locked cargo-auditable --version 0.7.7
      - name: Build
        run: cargo auditable build --release --locked -p apsophos --no-default-features --features directml

      - name: Sign the program
        if: env.CAN_SIGN == 'true'
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        shell: pwsh
        run: scripts/sign.ps1 target/release/apsophos.exe

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package and installer
        shell: cmd
        run: call scripts\package.bat nonvidia < nul

      - name: Sign the installer
        if: env.CAN_SIGN == 'true'
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        shell: pwsh
        run: scripts/sign.ps1 "dist/$env:NAME-setup.exe"

      - name: winget manifest
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$env:VERSION" }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$env:NAME-setup.exe"
          scripts/winget-manifest.ps1 -Version $env:VERSION -Installer "dist/$env:NAME-setup.exe" -InstallerUrl $url -OutDir dist/winget

      # SHA-256 of what the release hands out, after signing: the zip, the
      # installer and the SCUNet models in the package (named by their path
      # in the unzipped folder), in the format of `sha256sum -c`
      - name: SHA256SUMS
        shell: pwsh
        run: |
          $models = @(Get-ChildItem "dist/$env:NAME/models" -Filter '*.onnx' -File | Sort-Object Name | ForEach-Object { "$env:NAME/models/$($_.Name)" })
          if ($models.Count -eq 0) { throw "no models in dist/$env:NAME/models" }
          $lines = foreach ($file in @("$env:NAME.zip", "$env:NAME-setup.exe") + $models) {
            $path = Join-Path 'dist' $file
            if (-not (Test-Path $path -PathType Leaf)) { throw "missing: $path" }
            '{0}  {1}' -f (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant(), $file
          }
          $sums = Join-Path $PWD 'dist/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($sums, ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content $sums

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.zip
            dist/${{ env.NAME }}-setup.exe
            dist/SHA256SUMS.txt
            dist/winget/
          if-no-files-found: error

      # signed record of which workflow and commit built the files
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            dist/${{ env.NAME }}.zip
            dist/${{ env.NAME }}-setup.exe
            dist/SHA256SUMS.txt
      # the attestation also as a release file, for `gh attestation verify
      # --bundle` without asking GitHub
      - name: Provenance file
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE "dist/$env:NAME.provenance.sigstore.json"

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/${{ env.NAME }}.zip
            dist/${{ env.NAME }}-setup.exe
            dist/SHA256SUMS.txt
            dist/${{ env.NAME }}.provenance.sigstore.json
