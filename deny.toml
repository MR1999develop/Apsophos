# cargo-deny: licences, security advisories and sources of the dependencies.
#   cargo install cargo-deny   (once)
#   cargo deny check
# The program is GPL-3.0-only: every licence allowed below is compatible
# with it. A new dependency with another licence stops the check until its
# licence has been looked at and, if compatible, added here.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# unsound APIs are bugs that safe code can turn into memory errors: refused
# everywhere, not only in direct dependencies
unsound = "all"
# Unmaintained crates with no known vulnerability and no successor yet, all
# in the Linux-only part of eframe 0.37 (not in the Windows build): look again
# when eframe is updated.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit's Wayland decorations (sctk-adwaita), Linux only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit_unix (D-Bus accessibility), Linux only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit_unix (D-Bus accessibility), Linux only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit_unix (D-Bus accessibility), Linux only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # jpeg-encoder (derived from the Independent JPEG Group's code)
    "IJG",
    # root certificates used by ONNX Runtime's build script to download its libraries
    "CDLA-Permissive-2.0",
    # fonts embedded by egui
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "Ubuntu-font-1.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
