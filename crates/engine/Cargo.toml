[package]
name = "denoise_engine"
description = "SCUNet inference on ONNX Runtime for Apsophos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# GPU on Windows with any DirectX 12 card (NVIDIA RTX, AMD, Intel); no CUDA install needed
directml = ["ort/directml"]
# TensorRT for RTX (FP16 models, RTX 30xx and later); needs the two TensorRT
# for RTX DLLs next to the program, but not CUDA or cuDNN
nvrtx = ["ort/nvrtx"]

[dependencies]
denoise_core.workspace = true
thiserror.workspace = true
serde.workspace = true
# rc.15 = ONNX Runtime 1.31, whose TensorRT for RTX provider needs TensorRT for RTX 1.4
ort = "=2.0.0-rc.15"

[lints]
workspace = true
