[workspace]
resolver = "2"
# xtask: the checks (`cargo xtask check`), run by scripts\check.bat and the CI
members = ["crates/core", "crates/io", "crates/engine", "crates/platform", "crates/app", "xtask"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.99"
authors = ["MR"]
# not published on crates.io: cargo-deny then treats the crates as private
# and accepts the path dependencies between them
publish = false

[workspace.dependencies]
denoise_core = { path = "crates/core" }
denoise_io = { path = "crates/io" }
denoise_engine = { path = "crates/engine" }
denoise_platform = { path = "crates/platform" }
thiserror = "2"
anyhow = "1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# conversions that can change a value: through denoise_core::num or quant
# only. Precision loss (usize to f32 for coordinates, counts and progress)
# stays allowed: those values are far below 2^24.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "allow"

[profile.release]
lto = "thin"
codegen-units = 4

# The domain crates check integer overflow in release too: they work out
# sizes and offsets from what files declare.
[profile.release.package.denoise_core]
overflow-checks = true

[profile.release.package.denoise_io]
overflow-checks = true

# Dependencies (decoders, ONNX Runtime) optimised in debug builds too:
# without this, opening a 100 MB TIFF in debug takes tens of seconds.
[profile.dev.package."*"]
opt-level = 3
